[package]
name = "sandbox-workspace-agent-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-sandbox = { path = "../../adk-sandbox", features = ["workspace"] }
adk-runner = { package = "agentx-adk-runner", path = "../../adk-runner", features = ["sandbox-runner"] }
adk-agent = { package = "agentx-adk-agent", path = "../../adk-agent" }
adk-model = { package = "agentx-adk-model", path = "../../adk-model", features = ["gemini"] }
adk-core = { package = "agentx-adk-core", path = "../../adk-core" }
adk-session = { package = "agentx-adk-session", path = "../../adk-session" }
adk-tool = { package = "agentx-adk-tool", path = "../../adk-tool" }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }

[features]
default = []
workspace-docker = ["adk-sandbox/workspace-docker"]
