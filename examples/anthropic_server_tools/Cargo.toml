[package]
name = "anthropic-server-tools-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-core = { package = "agentx-adk-core", path = "../../adk-core" }
adk-rust = { package = "agentx-adk-rust", path = "../../adk-rust", features = ["standard"] }
adk-model = { package = "agentx-adk-model", path = "../../adk-model", features = ["anthropic"] }
adk-tool = { package = "agentx-adk-tool", path = "../../adk-tool" }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
